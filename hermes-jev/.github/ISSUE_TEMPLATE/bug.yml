name: Something is wrong
description: A Jev skill, the plugin, the CLI or the dashboard did not do what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste an API key, a real transcript, a customer's data or a decision
        log from a working machine. `jev doctor` output is safe: it reports presence and
        latency, never a key and never prompt text.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      placeholder: |
        I ran `jev pick-skill` and it suggested nothing on a turn that clearly needed a skill.
        I expected it to suggest jev-computer-use.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: The smallest way to see it again
      description: A command, an input, and what came back. Redact anything private.
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `jev doctor`
      description: Paste it as-is. It contains no key and no prompt text.
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: "`jev doctor` reports it, or say which commit."
    validations: {required: true}
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      multiple: true
      options: [Hermes, Claude Code, Codex, "the jev CLI on its own", "the router dashboard", other]
    validations: {required: true}
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: macOS 15.6, Python 3.9.6
